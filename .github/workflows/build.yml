name: Build TSG809 Battery App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Publish Release App
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TSG809-Battery-App
        path: output/*.exe
